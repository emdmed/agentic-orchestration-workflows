name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Blocking: code correctness only. No network/deploy dependency.
  unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run offline test suite
        run: npm run test:unit

  # Smoke-tests the LIVE production CDN, so it's only meaningful after merge +
  # deploy. Runs on main and manual dispatch only — never on PRs, where prod is
  # unchanged and a newly added/renamed endpoint would always (correctly) 404.
  cdn:
    name: CDN endpoint smoke tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check deployed CDN endpoints
        run: npm run test:cdn
